<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guessing Number Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Language Toggle Switch (Top-Right) -->
<div class="top-controls">
  <div class="lang-toggle-container">
    <span class="lang-label">EN</span>
    <label class="switch">
      <input type="checkbox" id="langToggle" onchange="toggleLanguage()">
      <span class="slider round"></span>
    </label>
    <span class="lang-label">বাং</span>
  </div>
</div>

<div class="game-card" id="gameCard">
  <!-- Theme Toggle Switch -->
  <div class="theme-switch-container">
    <span id="themeLabel">☀️</span>
    <label class="switch">
      <input type="checkbox" id="themeToggle" onchange="toggleTheme()">
      <span class="slider round"></span>
    </label>
    <span>🌙</span>
  </div>

  <h1 id="titleText">WELCOME TO GUESSING NUMBER GAME</h1>
  <p id="subtitleText">Guess a Number Between 1 - 100</p>

  <div id="triesCounter" class="tries-counter">Tries Left: 5</div>
  
  <div class="input-group">
    <input type="number" id="guessInput" min="1" max="100" placeholder="Please, Enter your number:" oninput="validateInput(this)">
    <button id="submitBtn" onclick="checkGuess()">Submit</button>
  </div>
  
  <div id="message" class="message"></div>
  <button id="restartBtn" class="restart-btn" onclick="initGame()">Play Again</button>

  <footer class="game-footer" id="footerText">Made By Raiyan Muhit, Do not copy this project</footer>
</div>

<!-- Bottom-Right Branding -->
<div class="bottom-right-watermark">
  <div>v0.2</div>
  <div>R3-DEV©</div>
</div>

<script src="script.js"></script>
</body>
</html>
